[package]
name = "drift"
version = "0.1.0"
edition = "2021"

[dependencies]
# Tidal API (direct HTTP, not using tidalrs SDK)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# Audio metadata tagging
id3 = "1.16"
metaflac = "0.2"

# TUI framework
ratatui = "0.30"
crossterm = "0.28"

# Shared TUI widgets (scrollable list, tab bar, progress bar, text input, dialogs)
rat-widgets = { git = "ssh://git@github.com/brittonr/subwayrat.git", rev = "2e52b3150819a2365aaefd3dcf8bbd2a2fa2e901" }

# MPD control (uses mpc CLI, not mpd_client)

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
which = "6"

# Album art display
image = "0.25"
ratatui-image = { version = "1.0", features = ["serde"] }

# Logging
tracing = "0.1"

# Configuration
toml = "0.8"

# Random number generation (for album radio track selection)
rand = "0.8"

# Embedded key-value store for tidal-dl download history
redb = "2"

# Content-addressed hashing (for sync download dedup)
blake3 = "1"

# HTML scraping (for Bandcamp search)
scraper = "0.20"
urlencoding = "2"

# Fuzzy matching for search (used by helix-editor, ~6x faster than skim)
nucleo = "0.5"

# LRU cache for bounded memory usage
lru = "0.12"

# Hostname detection (for Aspen user ID)
hostname = "0.4"

# Server-side plugin logic (dedup, TTL, pruning) — also usable client-side
drift-plugin = { path = "crates/drift-plugin" }

# S3-compatible object storage (AWS SigV4 signing stays in the SDK).
object_store = { version = "0.12", features = ["aws"], optional = true }

# Atomic, owner-only credential replacement.
tempfile = "3"

# Unix ownership and no-follow file opens for the authorization broker.
libc = "0.2"

[features]
default = ["s3"]
s3 = ["dep:object_store"]

[lib]
name = "drift"
path = "src/lib.rs"

[[bin]]
name = "drift"
path = "src/main.rs"

[[bin]]
name = "tidal-db"
path = "src/bin/tidal_db.rs"

[[bin]]
name = "drift-sync"
path = "src/bin/sync.rs"

[[bin]]
name = "drift-tidal-auth"
path = "src/bin/tidal_auth.rs"